- duration_ms: 55754
  prompt: How does auth.py work?
  response: '## auth.py Analysis


    **Purpose**: Authentication and session management module handling user login,
    sessions, and authorization.


    ### Core Components


    **1. Session Storage**

    - In-memory dictionary `_sessions` stores active sessions

    - Keys: token strings, Values: session metadata (user_id, username, role, timestamps)


    **2. Configuration**

    - `SESSION_DURATION_HOURS = 24` - sessions expire after 24 hours

    - `SECRET_KEY` - used for password hashing (hardcoded for testing)


    **3. Password Functions**

    - `hash_password()` - SHA-256 hashing with salt using SECRET_KEY

    - `verify_password()` - compares plain password against hash


    **4. Session Lifecycle**

    - `create_session()` - generates URL-safe token, stores session data with expiry

    - `get_session()` - retrieves session, auto-deletes if expired

    - `invalidate_session()` - removes session (logout)


    **5. Authorization Guards**

    - `require_auth()` - validates token exists and session is valid

    - `require_role()` - checks user has specific role (uses `UserRole` enum)

    - `require_admin()` - shorthand for admin role check


    **6. User Operations**

    - `login()` - authenticates username/password, creates session, returns token

    - `logout()` - invalidates session by token

    - `get_current_user()` - fetches User object from session token


    ### Dependencies

    - Imports `User` and `UserRole` from `src.models`

    - Imports `list_users` and `get_user` from `src.api` (circular import handled
    via function-level imports)


    ### Security Notes

    - Password verification in `login()` is bypassed (see line 96 comment)

    - Uses in-memory storage (sessions lost on restart)

    - SHA-256 with static salt (not bcrypt/argon2)'
  test_id: AD-003
  tokens_used: null
