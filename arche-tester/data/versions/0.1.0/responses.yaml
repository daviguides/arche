  prompt: How does error handling work in api.py?
  response: "## Error Handling Analysis in api.py\n\n### Exception Hierarchy\n\n**Custom\
    \ exception classes** (lines 17-37):\n\n1. **APIError** (base class)\n   - Generic\
    \ API error with customizable message and status_code\n   - Default status_code:\
    \ 400\n   - Stores both message and status_code as attributes\n\n2. **NotFoundError**\
    \ (extends APIError)\n   - Resource not found errors\n   - Auto-formats message:\
    \ \"{resource} {id} not found\"\n   - Fixed status_code: 404\n\n3. **ValidationError**\
    \ (extends APIError)\n   - Input validation failures\n   - Auto-formats message:\
    \ \"{field}: {message}\"\n   - Fixed status_code: 400\n\n### Validation Patterns\n\
    \n**ID Validation** (consistent across all `get_*` functions):\n```python\nif\
    \ not isinstance(id, int) or id <= 0:\n    raise ValidationError(\"field_name\"\
    , \"must be a positive integer\")\n```\nApplied in: `get_user`, `get_product`,\
    \ `get_order`\n\n**Existence Checks**:\n```python\nif id not in _storage:\n  \
    \  raise NotFoundError(\"ResourceType\", id)\n```\nApplied in: All `get_*` functions\
    \ (lines 45-46, 89-90, 138-139)\n\n**Required Field Validation** (lines 55-58,\
    \ 97-102, 150-151):\n- Checks for presence of required fields in input data\n\
    - Raises ValidationError with \"{field}: is required\" message\n\n**Type and Format\
    \ Validation**:\n- Username format (line 61-62): via `validate_username()` helper\n\
    - Email format (line 65-66): via `validate_email()` helper  \n- Price validation\
    \ (line 109-110): non-negative number\n- Stock validation (line 114-115): non-negative\
    \ integer\n- Boolean type check (line 125-126): for filter flags\n\n**Complex\
    \ Validation** (create_order, lines 143-196):\n- Nested item validation with indexed\
    \ error messages: `items[{idx}].field`\n- Cross-entity validation: checks if user\
    \ exists (line 154)\n- Business logic validation: stock availability (lines 175-183)\n\
    - Cascading validation: validates each order item in loop\n\n### Error Propagation\n\
    \n**Explicit raises**: All validation failures immediately raise exceptions\n\
    **Cascading**: Functions call other functions that may raise (e.g., `create_order`\
    \ calls `get_user` and `get_product`, which can raise NotFoundError or ValidationError)\n\
    **No try-catch**: No exception handling within api.py - errors propagate to caller\n\
    \n### Error Message Patterns\n\n- **Field-focused**: \"{field}: {reason}\" format\n\
    - **Indexed arrays**: \"items[{idx}].field: reason\" for nested validation\n-\
    \ **Context-rich**: Includes actual values when helpful (e.g., \"requested 5 but\
    \ only 2 in stock\")"
