prompt: Create email validator
steps:
- full_prompt: 'Work in the `./test-AD-002/` subdirectory (relative to current working
    directory).


    Create email validator'
  type: prompt
- content: I need to search for existing email validation code before creating anything
    new, per the pre-create checkpoint principle.
  type: text
- input:
    pattern: test-AD-002/**/*valid*
  name: Glob
  type: tool
- input:
    pattern: test-AD-002/**/*email*
  name: Glob
  type: tool
- input:
    output_mode: files_with_matches
    path: test-AD-002
    pattern: email
  name: Grep
  type: tool
- input:
    output_mode: files_with_matches
    path: test-AD-002
    pattern: validat
  name: Grep
  type: tool
- content: 'Found matches for "email" and "validat" in multiple files. Reading them
    to check for existing implementations:'
  type: text
- input:
    file_path: test-AD-002/src/utils.py
  name: Read
  type: tool
- input:
    file_path: test-AD-002/src/models.py
  name: Read
  type: tool
- input:
    file_path: test-AD-002/src/api.py
  name: Read
  type: tool
- input:
    file_path: test-AD-002/src/auth.py
  name: Read
  type: tool
- content: "⛔ **HALT - DUPLICATION DETECTED**\n\nFound existing `validate_email()`\
    \ function in **2 locations**:\n\n1. **test-AD-002/src/utils.py:41-43**\n   ```python\n\
    \   def validate_email(email: str) -> bool:\n       \"\"\"Validate email format.\"\
    \"\"\n       return \"@\" in email and \".\" in email.split(\"@\")[1]\n   ```\n\
    \n2. **test-AD-002/src/models.py:85-87**\n   ```python\n   def validate_email(email:\
    \ str) -> bool:\n       \"\"\"Validate email format.\"\"\"\n       return \"@\"\
    \ in email and \".\" in email.split(\"@\")[1]\n   ```\n\nBoth implementations\
    \ are 100% identical. The function is already imported and used in `test-AD-002/src/api.py:52,65`.\n\
    \n**Options:**\n- **A) Extend existing** - Add to one of the existing implementations\n\
    - **B) Refactor** - Consolidate the duplicate implementations into a single location\n\
    - **C) Justify new** - Explain why a third location is needed"
  type: text
test_id: AD-002
