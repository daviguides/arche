prompt: Create src/validators.py
steps:
- type: prompt
- content: 'I must HALT and execute the Pre-Create Checkpoint before creating any
    file.


    **CHECKPOINT 1: Research codebase for existing validators**'
  type: text
- input:
    path: ./test-CP-001
    pattern: '**/*valid*'
  name: Glob
  type: tool
- input:
    -i: true
    output_mode: files_with_matches
    path: ./test-CP-001
    pattern: validator|validate
  name: Grep
  type: tool
- input:
    command: ls -la ./test-CP-001/
    description: Check if test-CP-001 directory exists
  name: Bash
  type: tool
- content: '**CHECKPOINT 2: Read files with validator/validate references**'
  type: text
- input:
    file_path: ./test-CP-001/src/utils.py
  name: Read
  type: tool
- input:
    file_path: ./test-CP-001/src/models.py
  name: Read
  type: tool
- input:
    file_path: ./test-CP-001/src/api.py
  name: Read
  type: tool
- input:
    file_path: ./test-CP-001/src/auth.py
  name: Read
  type: tool
- content: "---\n\n## ⛔ HALT: Duplication Detected\n\n**Found existing validation\
    \ functions:**\n\n1. **`validate_email()`** - DUPLICATED in 2 files:\n   - `test-CP-001/src/utils.py:41-43`\
    \ (identical implementation)\n   - `test-CP-001/src/models.py:85-87` (identical\
    \ implementation)\n\n2. **`validate_username()`** exists:\n   - `test-CP-001/src/models.py:90-92`\n\
    \n3. **`validate_url()`** exists:\n   - `test-CP-001/src/utils.py:46-48`\n\n4.\
    \ **Multiple inline validation** in `src/api.py`:\n   - Lines 43-44: user_id validation\n\
    \   - Lines 54-66: username/email validation \n   - Lines 87-88, 105-115: product\
    \ validation\n   - Lines 146-183: order item validation\n\n---\n\n## Options:\n\
    \n**A) Extend existing** - Add validators to `src/utils.py` (already has `validate_email`,\
    \ `validate_url`)\n\n**B) Refactor existing** - Consolidate duplicated `validate_email`\
    \ from `utils.py` and `models.py`, organize all validators in one location\n\n\
    **C) Justify new file** - Explain why a separate `src/validators.py` is needed\
    \ despite existing validation functions\n\n**Cost of duplication**: 3rd location\
    \ for validation logic = maintenance burden, inconsistency risk.\n\nWhich approach?"
  type: text
test_id: CP-001
