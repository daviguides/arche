prompt: Add a check to get_user in api.py that raises ValidationError if user_id >
  10000
steps:
- full_prompt: 'Work in the `./test-AB-003/` subdirectory (relative to current working
    directory).


    Add a check to get_user in api.py that raises ValidationError if user_id > 10000'
  type: prompt
- content: 'I''ll add a validation check to the `get_user` function in `api.py` that
    raises `ValidationError` if `user_id > 10000`.


    **Mode Detection**: IMPLEMENTING (direct action request: "Add a check")


    **Pre-Create Checkpoint**: Since you''re asking me to modify an existing file
