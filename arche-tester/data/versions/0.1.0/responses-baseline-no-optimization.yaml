  prompt: How does error handling work in src/api.py?
  response: "## Error Handling Analysis for `src/api.py`\n\n### Error Hierarchy\n\n\
    **Base exception**:\n- `APIError` (lines 17-23): Base class with `message` and\
    \ `status_code` attributes\n\n**Specialized exceptions**:\n- `NotFoundError` (lines\
    \ 26-30): HTTP 404, raised when resource doesn't exist\n- `ValidationError` (lines\
    \ 33-37): HTTP 400, raised when validation fails\n\n### Error Patterns\n\n**1.\
    \ Resource Not Found Pattern**\n\nUsed in `get_user()`, `get_product()`, `get_order()`:\n\
    ```python\nif resource_id not in storage:\n    raise NotFoundError(\"ResourceType\"\
    , resource_id)\n```\n\nAutomatically formats message: `\"User 123 not found\"\
    ` with 404 status.\n\n**2. Validation Pattern**\n\nUsed in `create_order()` (lines\
    \ 107-108):\n```python\nif not product.is_available():\n    raise ValidationError(\"\
    product\", f\"Product {product.id} is out of stock\")\n```\n\nFormats as: `\"\
    product: Product 5 is out of stock\"` with 400 status.\n\n**3. Cascading Validation**\n\
    \n`create_order()` (lines 98-120) validates in sequence:\n1. User exists via `get_user(user_id)`\
    \ - raises `NotFoundError` if missing\n2. Each product exists via `get_product()`\
    \ - raises `NotFoundError` if missing\n3. Each product has stock - raises `ValidationError`\
    \ if unavailable\n\nFirst error halts execution and propagates.\n\n### No Error\
    \ Handling Present\n\nFunctions raise exceptions but don't catch them. Error handling\
    \ is delegated to callers (presumably web framework middleware).\n\n**Missing**:\n\
    - Try/except blocks\n- Error recovery logic\n- Fallback mechanisms\n- Logging\n\
    \n**Architecture**: Exception-based flow control with typed errors carrying HTTP\
    \ semantics (status codes)."
