  response: '## Order Total Calculation


    The Order model calculates totals in two levels:


    **OrderItem.total** (lines 63-66):

    - Property that calculates individual item total

    - Formula: `quantity * unit_price`


    **Order.total** (lines 78-81):

    - Property that calculates full order total

    - Formula: `sum(item.total for item in self.items)`

    - Iterates through all OrderItem instances and sums their totals


    **Flow**:

    ```

    Order.total → sum of → OrderItem.total (qty × price) for each item

    ```'
