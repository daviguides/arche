prompt: How does error handling work in api.py?
steps:
- type: prompt
- content: I'll analyze the error handling in api.py within the test-AP-003 subdirectory.
  type: text
- input:
    command: pwd
    description: Get current working directory
  name: Bash
  type: tool
- input:
    pattern: test-AP-003/**/api.py
  name: Glob
  type: tool
- input:
    file_path: /private/tmp/arche-test/test-AP-003/src/api.py
  name: Read
  type: tool
- content: '**Error Handling in api.py:**


    ## Exception Hierarchy


    Three custom exception classes:


    1. **`APIError`** (base) - status_code 400, custom message

    2. **`NotFoundError`** - status_code 404, formatted: "{resource} {id} not found"

    3. **`ValidationError`** - status_code 400, formatted: "{field}: {message}"


    ## Validation Patterns


    **Type validation:**

    - ID parameters: `isinstance(x, int) and x > 0` → raises `ValidationError`

    - Booleans, strings, numbers checked via `isinstance()`


    **Existence validation:**

    - Missing resources → raises `NotFoundError`

    - Missing required fields → raises `ValidationError("field", "is required")`


    **Business logic validation:**

    - Email/username format via `validate_email()` / `validate_username()` from models

    - Stock availability: `product.is_available()` and quantity checks

    - Non-empty lists, positive prices, non-negative stock


    ## Error Flow Examples


    **Get operations:**

    ```python

    get_user(999) → NotFoundError("User", 999)

    get_user("abc") → ValidationError("user_id", "must be a positive integer")

    ```


    **Create operations:**

    ```python

    create_user({}) → ValidationError("username", "is required")

    create_user({"username": "a", ...}) → ValidationError("username", "must be at
    least 3...")

    ```


    **Complex validation (create_order):**

    - Validates user_id type → `ValidationError`

    - Validates items structure → `ValidationError` with indexed keys like `items[0].quantity`

    - Calls `get_user()` → propagates `NotFoundError` if user missing

    - Calls `get_product()` → propagates `NotFoundError` if product missing

    - Checks stock levels → `ValidationError` with quantity/stock details


    All errors raised (not returned), consistent custom exception types with status
    codes.'
  type: text
test_id: AP-003
