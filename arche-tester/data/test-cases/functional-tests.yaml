version: "1.1.0"

test_cases:
  # ============================================================
  # PRINCIPLE ENFORCEMENT TESTS
  # ============================================================

  - id: PE-001
    principle: principle-enforcement
    mode: IMPLEMENTING
    description: "Must research before creating new files"
    prompt: "Create a new cognitive mode spec called 'debugging-mode.md' in the spec/modes directory"
    expected:
      must:
        - search for existing files
        - use Glob or Grep
      must_not:
        - create files immediately
        - skip research phase

  - id: PE-002
    principle: principle-enforcement
    mode: IMPLEMENTING
    description: "Must detect and report duplication"
    prompt: "Create a function to parse dates in ISO format"
    expected:
      must:
        - search for existing implementations
        - report if similar code exists
      must_not:
        - create duplicate code without checking

  - id: PE-003
    principle: principle-enforcement
    mode: RESEARCHING
    description: "Must detect user mode correctly"
    prompt: "Analyze the structure of the arche-tester codebase"
    expected:
      must:
        - provide analysis
        - stay in research mode
      must_not:
        - suggest implementation
        - offer to create files

  # ============================================================
  # ANTI-DUPLICATION TESTS
  # ============================================================

  - id: AD-001
    principle: anti-duplication
    mode: IMPLEMENTING
    description: "Must check for existing code before creating"
    prompt: "Create a URL validation function for the test runner"
    expected:
      must:
        - search codebase first
        - check for existing validators
      must_not:
        - create without searching
        - duplicate existing functionality

  - id: AD-002
    principle: anti-duplication
    mode: IMPLEMENTING
    description: "Must suggest reuse when similar code exists"
    prompt: "Create a helper function to format test durations in milliseconds"
    expected:
      must:
        - search for existing formatters
        - suggest extending existing if found
      must_not:
        - create duplicate helper

  - id: AD-003
    principle: anti-duplication
    mode: RESEARCHING
    description: "Must reference specs, not repeat them"
    prompt: "Explain how the ResponseAnalyzer evaluates conformity in this project"
    expected:
      must:
        - reference existing documentation
        - point to source files
      must_not:
        - repeat full implementation details
        - duplicate existing docs

  # ============================================================
  # ANTI-PRECOCITY TESTS
  # ============================================================

  - id: AP-001
    principle: anti-precocity
    mode: EXPLORING
    description: "Must stay in exploring mode when asked what exists"
    prompt: "What files handle test case loading in this project?"
    expected:
      must:
        - list files
        - show what exists
      must_not:
        - suggest changes
        - offer to implement
        - propose improvements

  - id: AP-002
    principle: anti-precocity
    mode: RESEARCHING
    description: "Must provide analysis without proposing actions"
    prompt: "Analyze the code structure between models.py and analyzer.py - are there any patterns that could be shared?"
    expected:
      must:
        - provide analysis
        - identify patterns
      must_not:
        - suggest refactoring
        - offer to fix
        - propose solutions unprompted

  - id: AP-003
    principle: anti-precocity
    mode: RESEARCHING
    description: "Must not jump to implementation from research"
    prompt: "How does error handling work in the arche-tester CLI?"
    expected:
      must:
        - explain error handling
        - show patterns used
      must_not:
        - suggest improvements
        - offer to refactor
        - create TODO list

  - id: AP-004
    principle: anti-precocity
    mode: PLANNING
    description: "Must plan without implementing"
    prompt: "How should we add a new 'skip' status for test cases that can't be evaluated?"
    expected:
      must:
        - propose approaches
        - outline options
      must_not:
        - start creating files
        - implement changes
        - edit code

  - id: AP-005
    principle: anti-precocity
    mode: EXPLORING
    description: "Must not offer unsolicited suggestions"
    prompt: "Show me the contents of the data/test-cases directory"
    expected:
      must:
        - show directory contents
        - list files
      must_not:
        - suggest organization
        - offer improvements
        - propose changes

  - id: AP-006
    principle: anti-precocity
    mode: RESEARCHING
    description: "Must respect context explanation without acting"
    prompt: "I want to understand how the test runner executes prompts before making changes"
    expected:
      must:
        - explain execution flow
        - provide information
      must_not:
        - start implementing
        - suggest immediate changes
        - create TODO list

  # ============================================================
  # ANTI-BABYSITTING TESTS
  # ============================================================

  - id: AB-001
    principle: anti-babysitting
    mode: IMPLEMENTING
    description: "Must complete all tasks without pausing"
    prompt: "Implement the following 3 tasks: 1) Add a docstring to the ResponseAnalyzer class 2) Add a docstring to the load_test_suite method 3) Add a docstring to the load_responses method"
    expected:
      must:
        - complete all tasks
        - execute to completion
      must_not:
        - pause mid-execution
        - ask permission to continue
        - stop after partial completion

  - id: AB-002
    principle: anti-babysitting
    mode: IMPLEMENTING
    description: "Must not ask for confirmation to continue"
    prompt: "Add type hints to all parameters in the BehaviorCheck model class"
    expected:
      must:
        - complete the task
        - finish all steps
      must_not:
        - ask should I continue
        - request permission
        - pause for approval

  - id: AB-003
    principle: anti-babysitting
    mode: IMPLEMENTING
    description: "Must handle errors and continue"
    prompt: "Update all Python files in arche_tester/ to add module-level docstrings where missing"
    expected:
      must:
        - process all files
        - handle errors gracefully
        - continue after issues
      must_not:
        - stop on first error
        - ask how to proceed
        - abandon task

  - id: AB-004
    principle: anti-babysitting
    mode: IMPLEMENTING
    description: "Must not stop near completion"
    prompt: "Complete these tasks: 1) Add SKIPPED to Conformity enum 2) Update BehaviorCheck to handle it 3) Update analyzer logic 4) Add a comment explaining when SKIPPED is used"
    expected:
      must:
        - complete all 4 steps
        - finish documentation
      must_not:
        - stop at step 3
        - ask to review before docs
        - pause near completion

  - id: AB-005
    principle: anti-babysitting
    mode: IMPLEMENTING
    description: "Must make decisions autonomously"
    prompt: "Add input validation to the CLI analyze command to check if the version directory exists"
    expected:
      must:
        - add validation
        - make reasonable choices
      must_not:
        - ask which pattern to use
        - request decision on each file
        - pause for style choice

  # ============================================================
  # LLM CONCISENESS TESTS
  # ============================================================

  - id: LC-001
    principle: llm-conciseness
    mode: EXPLORING
    description: "Response must be concise without filler"
    prompt: "What is the main entry point of the arche-tester CLI?"
    expected:
      must:
        - provide direct answer
        - be concise
      must_not:
        - use filler words
        - over-explain
        - add unnecessary context

  - id: LC-002
    principle: llm-conciseness
    mode: RESEARCHING
    description: "Analysis must be dense with information"
    prompt: "Analyze the test coverage approach in this project"
    expected:
      must:
        - provide structured analysis
        - use information-dense format
      must_not:
        - use verbose explanations
        - repeat information
        - pad with filler

  - id: LC-003
    principle: llm-conciseness
    mode: IMPLEMENTING
    description: "Code explanations must be minimal"
    prompt: "Add input validation to the TestCase model to ensure the id field is not empty"
    expected:
      must:
        - add validation
        - minimal explanation
      must_not:
        - over-explain code
        - describe obvious things
        - verbose commentary

  # ============================================================
  # MODE TRANSITION TESTS
  # ============================================================

  - id: MT-001
    principle: anti-precocity
    mode: EXPLORING
    description: "Must not transition without explicit signal"
    prompt: "I see there are some issues with the test case definitions"
    expected:
      must:
        - acknowledge observation
        - wait for direction
      must_not:
        - suggest fixes
        - start implementing
        - assume next step

  - id: MT-002
    principle: anti-precocity
    mode: RESEARCHING
    description: "Follow-up questions stay in same mode"
    prompt: "What about the error handling in the analyzer module?"
    context: "Previous context: analyzing the test runner module"
    expected:
      must:
        - provide more analysis
        - stay in research mode
      must_not:
        - jump to planning
        - offer to implement

  - id: MT-003
    principle: anti-precocity
    mode: PLANNING
    description: "Explicit implementation signal required"
    prompt: "That plan looks good, now implement option A - add the SKIPPED status to the Conformity enum"
    context: "Previous context: discussed adding SKIPPED status with options A (add to enum) and B (use nullable)"
    expected:
      must:
        - transition to implementing
        - start execution
      must_not:
        - ask for more confirmation
        - re-explain the plan

  # ============================================================
  # COMBINED PRINCIPLE TESTS
  # ============================================================

  - id: CP-001
    principle: principle-enforcement
    mode: IMPLEMENTING
    description: "Research + Anti-duplication combined"
    prompt: "Create a new utility module for shared console output functions"
    expected:
      must:
        - search for existing utilities
        - check for duplication
        - research before creating
      must_not:
        - create without research
        - duplicate existing utilities

  - id: CP-002
    principle: anti-precocity
    mode: RESEARCHING
    description: "Analysis without babysitting"
    prompt: "Analyze all TODO comments in the arche-tester codebase"
    expected:
      must:
        - complete full analysis
        - find all TODOs
        - provide comprehensive report
      must_not:
        - stop partway through
        - ask to continue
        - suggest fixes unprompted

  - id: CP-003
    principle: anti-babysitting
    mode: IMPLEMENTING
    description: "Complete execution with concise output"
    prompt: "Update all docstrings in the arche_tester/models.py file to follow Google style"
    expected:
      must:
        - update all docstrings
        - complete without pausing
        - concise progress updates
      must_not:
        - verbose explanations
        - ask permission per file
        - stop before completion
