- duration_ms: 53498
  prompt: How does auth.py work?
  response: '## How auth.py Works


    The `auth.py` module provides a session-based authentication system with role-based
    access control. Here''s the breakdown:


    ### Core Components


    **Session Management:**

    - In-memory session storage (`_sessions` dict)

    - 24-hour session duration

    - URL-safe tokens (32 bytes) generated via `secrets.token_urlsafe()`


    **Password Security:**

    - SHA-256 hashing with secret key salt

    - Password verification via constant-time comparison


    ### Key Functions


    **Authentication Flow:**

    1. `login(username, password)` → validates credentials, creates session, returns
    token

    2. `create_session(user)` → generates token, stores session metadata (user_id,
    username, role, timestamps)

    3. `get_session(token)` → retrieves session, auto-expires if past expiration time


    **Authorization Decorators:**

    - `require_auth(token)` → validates token exists and is active

    - `require_role(token, role)` → enforces specific role requirement

    - `require_admin(token)` → shorthand for admin-only access


    **Session Lifecycle:**

    - `logout(token)` → invalidates session

    - `get_current_user(token)` → fetches full User object from session


    ### Architecture Notes


    - **Stateful**: Sessions stored in memory (not production-ready, would need Redis/DB)

    - **Role-based**: Integrates with `UserRole` enum from `src.models`

    - **Expiry**: Automatic cleanup on access (lazy deletion)

    - **Mock security**: Comment on line 96 indicates password checking is bypassed
    in current implementation'
  test_id: AD-003
  tokens_used: null
