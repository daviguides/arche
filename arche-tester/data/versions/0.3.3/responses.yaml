- duration_ms: 35243
  prompt: How does auth.py work?
  response: "## auth.py Structure\n\n**Purpose**: Authentication module handling user\
    \ authentication, sessions, and authorization.\n\n**Key Components**:\n\n1. **Session\
    \ Storage**:\n   - `_sessions`: In-memory dict storing active sessions\n   - `SESSION_DURATION_HOURS\
    \ = 24`\n   - `SECRET_KEY`: Mock secret for testing\n\n2. **Password Functions**:\n\
    \   - `hash_password()`: SHA-256 hash with secret key salt\n   - `verify_password()`:\
    \ Compares password against hash\n\n3. **Session Management**:\n   - `create_session(user)`:\
    \ Generates secure token, stores user data with expiry\n   - `get_session(token)`:\
    \ Retrieves session, auto-expires if expired\n   - `invalidate_session(token)`:\
    \ Deletes session\n\n4. **Authorization Guards**:\n   - `require_auth(token)`:\
    \ Raises PermissionError if invalid/missing\n   - `require_role(token, required_role)`:\
    \ Checks specific role\n   - `require_admin(token)`: Shortcut for admin role check\n\
    \n5. **Login/Logout**:\n   - `login(username, password)`: Authenticates user,\
    \ returns session token\n   - `logout(token)`: Invalidates session\n   - `get_current_user(token)`:\
    \ Retrieves User object from session\n\n**Dependencies**: Imports `User` and `UserRole`\
    \ from `src.models`, uses `src.api` functions for user lookup."
  test_id: AD-003
