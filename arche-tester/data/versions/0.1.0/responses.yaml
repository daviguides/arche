- duration_ms: 45554
  prompt: How does auth.py work?
  response: "## Analysis of auth.py\n\n**auth.py** is a session-based authentication\
    \ module with the following components:\n\n### Core Functionality\n\n**Password\
    \ Management**:\n- `hash_password()` - Hashes passwords using SHA-256 with a secret\
    \ key salt\n- `verify_password()` - Verifies plaintext password against stored\
    \ hash\n\n**Session Management**:\n- In-memory session storage using `_sessions`\
    \ dict\n- `create_session()` - Generates secure token (32-byte URL-safe), stores\
    \ user data, sets 24-hour expiration\n- `get_session()` - Retrieves session by\
    \ token, auto-deletes if expired\n- `invalidate_session()` - Removes session (logout)\n\
    \n**Authentication & Authorization**:\n- `require_auth()` - Validates token exists\
    \ and session is active (raises PermissionError if not)\n- `require_role()` -\
    \ Enforces specific role requirement\n- `require_admin()` - Shortcut for admin-only\
    \ operations\n\n**User Operations**:\n- `login()` - Authenticates username (note:\
    \ password check is commented as \"In real app, would check password hash\")\n\
    - `logout()` - Invalidates session token\n- `get_current_user()` - Retrieves User\
    \ object from session\n\n### Architecture Details\n\n**Dependencies**: Imports\
    \ `User` and `UserRole` from `src.models`, calls `list_users()` and `get_user()`\
    \ from `src.api`\n\n**Session Data Structure**:\n```python\n{\n  \"user_id\":\
    \ int,\n  \"username\": str,\n  \"role\": str,  # UserRole enum value\n  \"created_at\"\
    : datetime,\n  \"expires_at\": datetime\n}\n```\n\n**Configuration**: 24-hour\
    \ session duration, hardcoded \"mock-secret-key-for-testing\"\n\n**Security Note**:\
    \ Login function (line 89-98) doesn't actually verify passwords - it authenticates\
    \ any user by username alone."
  test_id: AD-003
  tokens_used: null
