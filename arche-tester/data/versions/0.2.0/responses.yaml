  prompt: How does error handling work in api.py?
  response: "## Error Handling Analysis: api.py\n\nThe error handling in `api.py`\
    \ uses a **custom exception hierarchy** with consistent patterns across all endpoints.\n\
    \n### Exception Hierarchy\n\n**Base class**: `APIError` (line 17-23)\n- Stores\
    \ `message` and `status_code` (default 400)\n- All API errors inherit from this\n\
    \n**Specialized exceptions**:\n- `NotFoundError` (line 26-30): HTTP 404, format:\
    \ \"{resource} {id} not found\"\n- `ValidationError` (line 33-37): HTTP 400, format:\
    \ \"{field}: {message}\"\n\n### Validation Patterns\n\n**Input validation occurs\
    \ at entry points**:\n\n1. **ID validation** (user_id, product_id, order_id):\n\
    \   - Must be positive integer\n   - Raises `ValidationError` if invalid (lines\
    \ 43-44, 87-88, 136-137)\n\n2. **Existence checks**:\n   - Raises `NotFoundError`\
    \ when resource not in storage (lines 45-46, 89-90, 138-139)\n\n3. **Required\
    \ fields**:\n   - Checks presence in data dict before use\n   - Example: `create_user()`\
    \ validates username and email required (lines 55-58)\n\n4. **Format validation**:\n\
    \   - Username: 3+ alphanumeric chars via `validate_username()` (line 61-62)\n\
    \   - Email: valid format via `validate_email()` (line 65-66)\n\n5. **Type and\
    \ range validation**:\n   - Product price: non-negative number (lines 109-110)\n\
    \   - Product stock: non-negative integer (lines 114-115)\n   - Order items: non-empty\
    \ list (lines 150-151)\n\n6. **Business logic validation**:\n   - Product stock\
    \ availability (line 175-176)\n   - Quantity doesn't exceed stock (lines 179-183)\n\
    \n### Error Propagation\n\n**Cascading validation**: `create_order()` calls `get_user()`\
    \ and `get_product()`, allowing their validation errors to propagate naturally\
    \ (lines 154, 174).\n\n**Context-specific errors**: Array validation includes\
    \ index in error messages: `items[{idx}].quantity` (lines 163, 167, 171).\n\n\
    ### Key Characteristics\n\n- **Fail-fast**: Validates inputs before processing\n\
    - **Descriptive messages**: Errors include field name and reason\n- **Consistent\
    \ patterns**: All endpoints follow same validation structure\n- **Type safety**:\
    \ Uses `isinstance()` checks extensively\n- **HTTP-ready**: Status codes embedded\
    \ in exceptions"
  test_id: AP-003
