    subdirectory.
  type: text
- input:
    command: pwd
    description: Check current working directory
  name: Bash
  type: tool
- input:
    -n: true
    output_mode: content
    path: ./test-CP-002/src
    pattern: TODO
  name: Grep
  type: tool
- content: 'Found 2 TODO comments in `test-CP-002/src/models.py`:


    - **Line 28**: `# TODO: Add password hashing`

    - **Line 29**: `# TODO: Add email validation`'
  type: text
test_id: CP-002
