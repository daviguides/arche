- duration_ms: 65083
  prompt: How does auth.py work?
  response: "## How `auth.py` Works\n\nThe `auth.py` module provides a session-based\
    \ authentication system for the mock project. Here's the breakdown:\n\n### **Core\
    \ Components**\n\n1. **Session Storage** (`_sessions`)\n   - In-memory dictionary\
    \ storing active sessions\n   - Key: session token, Value: session data (user_id,\
    \ username, role, timestamps)\n\n2. **Configuration**\n   - `SESSION_DURATION_HOURS`:\
    \ 24-hour session lifetime\n   - `SECRET_KEY`: Mock key for password hashing (hardcoded\
    \ for testing)\n\n### **Password Management**\n\n- `hash_password()`: SHA-256\
    \ hash with secret key salt\n- `verify_password()`: Compares password hash against\
    \ stored hash\n\n### **Session Lifecycle**\n\n1. **Create** (`create_session()`)\n\
    \   - Generates cryptographically secure token (32 bytes, URL-safe)\n   - Stores\
    \ user data + timestamps\n   - Returns token for client use\n\n2. **Validate**\
    \ (`get_session()`)\n   - Retrieves session by token\n   - Auto-expires sessions\
    \ past 24 hours\n   - Returns session data or `None`\n\n3. **Destroy** (`invalidate_session()`)\n\
    \   - Removes session from storage\n   - Used for logout\n\n### **Authorization\
    \ Helpers**\n\n- `require_auth()`: Validates token exists and is active (raises\
    \ `PermissionError` if not)\n- `require_role()`: Checks user has specific role\n\
    - `require_admin()`: Shortcut for admin-only operations\n\n### **User Operations**\n\
    \n- `login()`: Authenticates username (password check commented out), creates\
    \ session\n- `logout()`: Invalidates session token\n- `get_current_user()`: Retrieves\
    \ full `User` object from session token\n\n### **Security Notes**\n\n⚠️ **This\
    \ is mock/test code** with intentional simplifications:\n- Password verification\
    \ disabled in `login()` (line 96)\n- Hardcoded secret key\n- In-memory sessions\
    \ (lost on restart)\n- SHA-256 without proper salt (should use bcrypt/argon2)\n\
    \nThe module provides basic auth infrastructure suitable for testing but **not\
    \ production use**."
  test_id: AD-003
  tokens_used: null
