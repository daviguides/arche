- duration_ms: 45485
  prompt: How does auth.py work?
  response: '## How auth.py Works


    **Authentication module** handling user sessions and authorization.


    ### Core Components


    **Session Storage:**

    - In-memory dict `_sessions` stores active sessions

    - 24-hour session duration

    - Mock secret key for testing


    **Password Functions:**

    - `hash_password()` - SHA-256 with secret key salt

    - `verify_password()` - Compares hashed passwords


    **Session Management:**

    - `create_session()` - Generates 32-byte URL-safe token, stores user data with
    expiration

    - `get_session()` - Retrieves session, auto-deletes if expired

    - `invalidate_session()` - Removes session from storage


    **Authorization Functions:**

    - `require_auth()` - Validates token exists and session is valid

    - `require_role()` - Validates specific role requirement

    - `require_admin()` - Shortcut for admin role check


    **Login/Logout:**

    - `login()` - Authenticates username (password check commented as mock), returns
    session token

    - `logout()` - Invalidates session token

    - `get_current_user()` - Retrieves User object from session


    **Flow:** User logs in → session token created → token used for subsequent requests
    → session validated via `require_auth()` or role checkers → logout invalidates
    token.'
  test_id: AD-003
