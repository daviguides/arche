- duration_ms: 62623
  prompt: How does error handling work in api.py?
  response: "## Error Handling in `api.py`\n\nThe error handling follows a **structured\
    \ exception hierarchy** pattern:\n\n### Exception Classes\n\n1. **`APIError`**\
    \ (base, lines 17-23)\n   - Custom message + HTTP status code\n   - Defaults to\
    \ 400 (Bad Request)\n\n2. **`NotFoundError`** (lines 26-30)\n   - Inherits from\
    \ APIError\n   - Status: 404\n   - Format: \"{resource} {id} not found\"\n\n3.\
    \ **`ValidationError`** (lines 33-37)\n   - Inherits from APIError  \n   - Status:\
    \ 400\n   - Format: \"{field}: {message}\"\n\n### Error Handling Strategy\n\n\
    **Input Validation → Type Checking → Existence Checks → Business Logic**\n\n####\
    \ ID Parameters\n- Type validation: `isinstance(user_id, int) or user_id <= 0`\n\
    - Raises `ValidationError` for invalid types/values\n- Raises `NotFoundError`\
    \ if resource doesn't exist\n\n#### Create Operations\n- Required field checks\
    \ → `ValidationError` if missing\n- Format validation (email, username, price)\
    \ → `ValidationError`\n- Type checks (string, int, float, bool) → `ValidationError`\n\
    - Range validation (non-negative prices, positive quantities)\n\n#### Business\
    \ Logic\n- Stock availability checks (lines 175-183)\n- User existence verification\
    \ via `get_user()` (line 154, 205)\n- Detailed error messages with context (e.g.,\
    \ `items[{idx}].quantity`)\n\nThe pattern is **fail-fast validation** with specific,\
    \ actionable error messages rather than generic exceptions."
  test_id: AP-003
  tokens_used: null
