prompt: Plan out the steps to refactor auth.py
steps:
- type: prompt
- content: I'll plan the refactoring steps for auth.py. Let me first research the
    codebase to understand what exists.
  type: text
- input:
    command: pwd
    description: Get current working directory
  name: Bash
  type: tool
- input:
    pattern: test-PL-002/**/*
  name: Glob
  type: tool
- input:
    file_path: /private/tmp/arche-test/test-PL-002/src/auth.py
  name: Read
  type: tool
- input:
    file_path: /private/tmp/arche-test/test-PL-002/src/utils.py
  name: Read
  type: tool
- input:
    file_path: /private/tmp/arche-test/test-PL-002/src/models.py
  name: Read
  type: tool
- input:
    file_path: /private/tmp/arche-test/test-PL-002/src/api.py
  name: Read
  type: tool
- input:
    output_mode: content
    path: test-PL-002
    pattern: import.*auth
  name: Grep
  type: tool
- input:
    output_mode: content
    path: test-PL-002
    pattern: from src.auth
  name: Grep
  type: tool
- content: "## Refactoring Plan for auth.py\n\nAnalysis complete. The file has several\
    \ issues suitable for refactoring:\n\n### Identified Issues\n\n1. **Security vulnerability**:\
    \ Hardcoded `SECRET_KEY` in source code\n2. **Weak password hashing**: Using SHA-256\
    \ without proper salt (salting with secret key is not standard)\n3. **Circular\
    \ import**: auth.py imports from api.py in `login()` and `get_current_user()`\n\
    4. **Missing password validation**: `login()` doesn't actually verify password\
    \ (TODO comment on line 96)\n5. **Global mutable state**: `_sessions` dict not\
    \ thread-safe\n6. **Configuration scattered**: `SESSION_DURATION_HOURS` and `SECRET_KEY`\
    \ inline\n\n### Refactoring Approach\n\n**Option A - Conservative refactor (maintain\
    \ structure)**:\n1. Extract configuration to config/settings.yaml\n2. Fix password\
    \ hashing (use bcrypt/argon2 or proper PBKDF2)\n3. Resolve circular imports by\
    \ moving user lookup logic\n4. Add proper password verification to `login()`\n\
    5. Add session cleanup mechanism for expired sessions\n\n**Option B - Architectural\
    \ refactor (separate concerns)**:\n1. Split into three modules:\n   - `auth/password.py`\
    \ - password hashing/verification\n   - `auth/session.py` - session management\n\
    \   - `auth/middleware.py` - authorization decorators\n2. Create `auth/config.py`\
    \ for auth configuration\n3. Inject dependencies instead of importing api.py\n\
    4. Add proper typing and error handling\n\n**Option C - Minimal security fix**:\n\
    1. Move `SECRET_KEY` to environment variable\n2. Fix password hashing with proper\
    \ library\n3. Implement actual password check in `login()`\n4. Add password field\
    \ to User model\n\nWhich approach fits your needs?"
  type: text
test_id: PL-002
