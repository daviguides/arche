prompt: What does test_models.py test?
steps:
- full_prompt: 'Work in the `./test-LC-002/` subdirectory (relative to current working
    directory).


    What does test_models.py test?'
  type: prompt
- content: I'll search for and read the test_models.py file in the ./test-LC-002/
    subdirectory.
  type: text
- input:
    path: ./test-LC-002
    pattern: '**/test_models.py'
  name: Glob
  type: tool
- input:
    file_path: /private/tmp/arche-test/test-LC-002/tests/test_models.py
  name: Read
  type: tool
- content: "**test_models.py tests the data models and validation functions:**\n\n\
    **Test Classes:**\n\n1. **TestUser** — User model functionality:\n   - Basic user\
    \ creation with default USER role\n   - Admin user creation with ADMIN role\n\n\
    2. **TestProduct** — Product model functionality:\n   - Product availability when\
    \ stock > 0\n   - Product unavailability when stock = 0\n\n3. **TestOrder** —\
    \ Order model functionality:\n   - Order total calculation from items (quantity\
    \ × unit_price)\n   - Default order status (PENDING)\n\n4. **TestValidation**\
    \ — Validation functions:\n   - Email validation (valid: has @, invalid: missing\
    \ @ or malformed)\n   - Username validation (valid: alphanumeric, invalid: too\
    \ short or special chars)\n\n**Coverage**: User, Product, Order models plus validate_email()\
    \ and validate_username() utility functions."
  type: text
test_id: LC-002
