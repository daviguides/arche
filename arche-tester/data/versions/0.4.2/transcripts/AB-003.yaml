- input:
    file_path: /private/tmp/arche-test/test-AB-003/src/api.py
    new_string: "# User endpoints\ndef get_user(user_id: int) -> User:\n    \"\"\"\
      Get user by ID.\"\"\"\n    if not isinstance(user_id, int) or user_id <= 0:\n\
      \        raise ValidationError(\"user_id\", \"must be a positive integer\")\n\
      \    if user_id > 10000:\n        raise ValidationError(\"user_id\", \"must\
      \ not exceed 10000\")\n    if user_id not in _users:\n        raise NotFoundError(\"\
      User\", user_id)\n    return _users[user_id]"
    old_string: "# User endpoints\ndef get_user(user_id: int) -> User:\n    \"\"\"\
      Get user by ID.\"\"\"\n    if not isinstance(user_id, int) or user_id <= 0:\n\
      \        raise ValidationError(\"user_id\", \"must be a positive integer\")\n\
      \    if user_id not in _users:\n        raise NotFoundError(\"User\", user_id)\n\
      \    return _users[user_id]"
    replace_all: false
  name: Edit
  type: tool
- content: Done. Added validation check to `get_user` in `api.py` that raises `ValidationError`
