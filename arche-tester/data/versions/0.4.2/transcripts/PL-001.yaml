- content: "## Caching Strategy for API\n\n### Current State Analysis\n\n**Existing\
    \ cache configuration** (settings.yaml):\n- Enabled by default\n- TTL: 300 seconds\
    \ (5 minutes)\n- Max size: 1000 entries\n\n**API structure**:\n- **Read endpoints**:\
    \ `get_user`, `get_product`, `get_order`, `list_users`, `list_products`, `list_orders`\n\
    - **Write endpoints**: `create_user`, `create_product`, `create_order`\n- **Storage**:\
    \ In-memory dictionaries (`_users`, `_products`, `_orders`)\n\n---\n\n### Strategy\
    \ Option A: Function-Level LRU Cache\n\n**Approach**: Decorator-based caching\
    \ on individual read endpoints\n\n**Implementation**:\n```python\nfrom functools\
    \ import lru_cache, wraps\nfrom time import time\n\n# Cache layer\n@ttl_cache(ttl_seconds=300)\n\
    def get_user(user_id: int) -> User:\n    # existing logic\n\n@ttl_cache(ttl_seconds=300)\
    \  \ndef get_product(product_id: int) -> Product:\n    # existing logic\n\n# Invalidation\
    \ on writes\ndef create_user(data):\n    user = User(...)\n    _users[user_id]\
    \ = user\n    get_user.cache_clear()  # Invalidate\n    return user\n```\n\n**Pros**:\
    \ Simple, minimal code change, Python-native\n**Cons**: No selective invalidation\
    \ (clears all cached users), no cross-endpoint coordination\n\n---\n\n### Strategy\
    \ Option B: Centralized Cache Layer\n\n**Approach**: Separate `cache.py` module\
    \ with namespace-aware caching\n\n**Implementation**:\n```python\n# src/cache.py\n\
    class APICache:\n    def __init__(self, ttl: int, max_size: int):\n        self._cache:\
    \ dict[str, tuple[Any, float]] = {}\n        self._ttl = ttl\n        self._max_size\
    \ = max_size\n    \n    def get(self, namespace: str, key: int) -> Any | None:\n\
    \        cache_key = f\"{namespace}:{key}\"\n        # Check expiry, return value\n\
    \    \n    def set(self, namespace: str, key: int, value: Any):\n        # Store\
    \ with timestamp\n    \n    def invalidate(self, namespace: str, key: int | None\
    \ = None):\n        # Clear specific key or entire namespace\n\n# Usage\ncache\
    \ = APICache(ttl=300, max_size=1000)\n\ndef get_user(user_id: int) -> User:\n\
    \    cached = cache.get(\"user\", user_id)\n    if cached:\n        return cached\n\
    \    user = _users[user_id]\n    cache.set(\"user\", user_id, user)\n    return\
    \ user\n```\n\n**Pros**: Fine-grained invalidation, supports namespaces, centralized\
    \ config\n**Cons**: More code, manual cache checks in every endpoint\n\n---\n\n\
    ### Strategy Option C: Redis-Backed External Cache\n\n**Approach**: Redis for\
    \ shared, persistent caching across processes\n\n**Implementation**:\n```python\n\
    import redis\nimport json\n\nredis_client = redis.Redis(host='localhost', port=6379,\
    \ db=0)\n\ndef get_user(user_id: int) -> User:\n    cache_key = f\"user:{user_id}\"\
    \n    cached = redis_client.get(cache_key)\n    if cached:\n        return User.parse_raw(cached)\n\
    \    \n    user = _users[user_id]\n    redis_client.setex(cache_key, 300, user.json())\n\
    \    return user\n```\n\n**Pros**: Shared across multiple API instances, persistence,\
    \ scalable\n**Cons**: External dependency, network overhead for local cache, requires\
    \ Redis setup\n\n---\n\n### Recommended Approach\n\n**Option B (Centralized Cache\
    \ Layer)** for this codebase because:\n\n1. **Architecture fit**: Single-process\
    \ API using in-memory storage matches in-memory cache\n2. **Fine-grained control**:\
    \ Can invalidate individual users/products without clearing all cached data\n\
    3. **Namespace support**: Prevents key collisions between users, products, orders\n\
    4. **Configuration-driven**: Respects existing `settings.yaml` cache config\n\
    5. **No external deps**: Keeps project self-contained\n\n**Cache invalidation\
    \ rules**:\n- `create_user` → invalidate `user:{id}` and `users:list:*`\n- `create_product`\
    \ → invalidate `product:{id}` and `products:list:*`\n- `create_order` → invalidate\
    \ `order:{id}`, `orders:list:*`, `orders:user:{user_id}`\n\n**Trade-offs**:\n\
    - Option A: Simpler but less control\n- Option C: Better if planning multi-instance\
    \ deployment (not indicated by current architecture)"
  type: text
