  prompt: Analyze src/models.py structure
  response: '## Structure Analysis: `src/models.py`


    **Purpose**: Pydantic data models for users, products, and orders


    ### Model Hierarchy


    **Enums** (2):

    - `UserRole`: admin/user/guest

    - `OrderStatus`: 5-state order lifecycle


    **Models** (4):

    - `User`: Authentication entity with role-based access

    - `Product`: Inventory item with availability check

    - `OrderItem`: Line item with calculated total

    - `Order`: Aggregate root with items and computed total


    ### Key Patterns


    **Composition**: `Order` → `list[OrderItem]` → references `Product` via `product_id`


    **Computed Properties**: Both `OrderItem.total` and `Order.total` use `@property`
    for derived values


    **Field Defaults**: `datetime.now` factory for timestamps, enum defaults for role/status


    **Validation Functions**: Two standalone validators at module level (lines 85-92)


    ### Outstanding Work


    Lines 28-29: TODO comments for password hashing and email validation (not implemented)


    Line 84 comment: Intentional duplication marker for testing purposes'
