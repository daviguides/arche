- input:
    content: "\"\"\"API endpoints for the mock project.\n\nContains HTTP handlers\
      \ for users, products, and orders.\n\"\"\"\n\nimport logging\nfrom typing import\
      \ Any\n\nfrom src.models import Order, Product, User, UserRole\n\n# Configure\
      \ logger\nlogger = logging.getLogger(__name__)\nlogger.setLevel(logging.DEBUG)\n\
      \n\n# In-memory storage (for testing)\n_users: dict[int, User] = {}\n_products:\
      \ dict[int, Product] = {}\n_orders: dict[int, Order] = {}\n\n\nclass APIError(Exception):\n\
      \    \"\"\"Base API error.\"\"\"\n\n    def __init__(self, message: str, status_code:\
      \ int = 400) -> None:\n        self.message = message\n        self.status_code\
      \ = status_code\n        super().__init__(message)\n\n\nclass NotFoundError(APIError):\n\
      \    \"\"\"Resource not found.\"\"\"\n\n    def __init__(self, resource: str,\
      \ id: int) -> None:\n        super().__init__(f\"{resource} {id} not found\"\
      , 404)\n\n\nclass ValidationError(APIError):\n    \"\"\"Validation failed.\"\
      \"\"\n\n    def __init__(self, field: str, message: str) -> None:\n        super().__init__(f\"\
      {field}: {message}\", 400)\n\n\n# User endpoints\ndef get_user(user_id: int)\
      \ -> User:\n    \"\"\"Get user by ID.\"\"\"\n    logger.debug(f\"get_user called\
      \ with user_id={user_id}\")\n\n    if not isinstance(user_id, int) or user_id\
      \ <= 0:\n        logger.warning(f\"Invalid user_id: {user_id} (type: {type(user_id).__name__})\"\
      )\n        raise ValidationError(\"user_id\", \"must be a positive integer\"\
      )\n\n    if user_id not in _users:\n        logger.error(f\"User {user_id} not\
      \ found in database\")\n        raise NotFoundError(\"User\", user_id)\n\n \
      \   logger.info(f\"Retrieved user {user_id}: {_users[user_id].username}\")\n\
      \    return _users[user_id]\n\n\ndef create_user(data: dict[str, Any]) -> User:\n\
      \    \"\"\"Create new user.\"\"\"\n    logger.debug(f\"create_user called with\
      \ data: {data}\")\n\n    from src.models import validate_email, validate_username\n\
      \n    # Validate required fields\n    if \"username\" not in data:\n       \
      \ logger.warning(\"User creation failed: username is required\")\n        raise\
      \ ValidationError(\"username\", \"is required\")\n    if \"email\" not in data:\n\
      \        logger.warning(\"User creation failed: email is required\")\n     \
      \   raise ValidationError(\"email\", \"is required\")\n\n    # Validate username\
      \ format\n    if not validate_username(data[\"username\"]):\n        logger.warning(f\"\
      Invalid username format: {data['username']}\")\n        raise ValidationError(\"\
      username\", \"must be at least 3 alphanumeric characters\")\n\n    # Validate\
      \ email format\n    if not validate_email(data[\"email\"]):\n        logger.warning(f\"\
      Invalid email format: {data['email']}\")\n        raise ValidationError(\"email\"\
      , \"invalid format\")\n\n    user_id = len(_users) + 1\n    user = User(id=user_id,\
      \ **data)\n    _users[user_id] = user\n\n    logger.info(f\"Created user {user_id}:\
      \ {user.username} ({user.email})\")\n    return user\n\n\ndef list_users(role:\
      \ UserRole | None = None) -> list[User]:\n    \"\"\"List all users, optionally\
      \ filtered by role.\"\"\"\n    logger.debug(f\"list_users called with role={role}\"\
      )\n\n    if role is not None and not isinstance(role, UserRole):\n        logger.warning(f\"\
      Invalid role type: {type(role).__name__}\")\n        raise ValidationError(\"\
      role\", \"must be a valid UserRole\")\n\n    users = list(_users.values())\n\
      \    if role:\n        users = [u for u in users if u.role == role]\n      \
      \  logger.info(f\"Listed {len(users)} users with role {role.value}\")\n    else:\n\
      \        logger.info(f\"Listed all {len(users)} users\")\n\n    return users\n\
      \n\n# Product endpoints\ndef get_product(product_id: int) -> Product:\n    \"\
      \"\"Get product by ID.\"\"\"\n    logger.debug(f\"get_product called with product_id={product_id}\"\
      )\n\n    if not isinstance(product_id, int) or product_id <= 0:\n        logger.warning(f\"\
      Invalid product_id: {product_id} (type: {type(product_id).__name__})\")\n  \
      \      raise ValidationError(\"product_id\", \"must be a positive integer\"\
      )\n\n    if product_id not in _products:\n        logger.error(f\"Product {product_id}\
      \ not found in database\")\n        raise NotFoundError(\"Product\", product_id)\n\
      \n    logger.info(f\"Retrieved product {product_id}: {_products[product_id].name}\"\
      )\n    return _products[product_id]\n\n\ndef create_product(data: dict[str,\
      \ Any]) -> Product:\n    \"\"\"Create new product.\"\"\"\n    logger.debug(f\"\
      create_product called with data: {data}\")\n\n    # Validate required fields\n\
      \    if \"name\" not in data:\n        logger.warning(\"Product creation failed:\
      \ name is required\")\n        raise ValidationError(\"name\", \"is required\"\
      )\n    if \"description\" not in data:\n        logger.warning(\"Product creation\
      \ failed: description is required\")\n        raise ValidationError(\"description\"\
      , \"is required\")\n    if \"price\" not in data:\n        logger.warning(\"\
      Product creation failed: price is required\")\n        raise ValidationError(\"\
      price\", \"is required\")\n\n    # Validate name\n    if not isinstance(data[\"\
      name\"], str) or not data[\"name\"].strip():\n        logger.warning(f\"Invalid\
      \ product name: {data.get('name')}\")\n        raise ValidationError(\"name\"\
      , \"must be a non-empty string\")\n\n    # Validate price\n    if not isinstance(data[\"\
      price\"], (int, float)) or data[\"price\"] < 0:\n        logger.warning(f\"\
      Invalid price: {data.get('price')}\")\n        raise ValidationError(\"price\"\
      , \"must be a non-negative number\")\n\n    # Validate stock if provided\n \
      \   if \"stock\" in data:\n        if not isinstance(data[\"stock\"], int) or\
      \ data[\"stock\"] < 0:\n            logger.warning(f\"Invalid stock value: {data.get('stock')}\"\
      )\n            raise ValidationError(\"stock\", \"must be a non-negative integer\"\
      )\n\n    product_id = len(_products) + 1\n    product = Product(id=product_id,\
      \ **data)\n    _products[product_id] = product\n\n    logger.info(f\"Created\
      \ product {product_id}: {product.name} (price: ${product.price})\")\n    return\
      \ product\n\n\ndef list_products(in_stock_only: bool = False) -> list[Product]:\n\
      \    \"\"\"List all products.\"\"\"\n    logger.debug(f\"list_products called\
      \ with in_stock_only={in_stock_only}\")\n\n    if not isinstance(in_stock_only,\
      \ bool):\n        logger.warning(f\"Invalid in_stock_only type: {type(in_stock_only).__name__}\"\
      )\n        raise ValidationError(\"in_stock_only\", \"must be a boolean\")\n\
      \n    products = list(_products.values())\n    if in_stock_only:\n        products\
      \ = [p for p in products if p.is_available()]\n        logger.info(f\"Listed\
      \ {len(products)} products in stock\")\n    else:\n        logger.info(f\"Listed\
      \ all {len(products)} products\")\n\n    return products\n\n\n# Order endpoints\n\
      def get_order(order_id: int) -> Order:\n    \"\"\"Get order by ID.\"\"\"\n \
      \   logger.debug(f\"get_order called with order_id={order_id}\")\n\n    if not\
      \ isinstance(order_id, int) or order_id <= 0:\n        logger.warning(f\"Invalid\
      \ order_id: {order_id} (type: {type(order_id).__name__})\")\n        raise ValidationError(\"\
      order_id\", \"must be a positive integer\")\n\n    if order_id not in _orders:\n\
      \        logger.error(f\"Order {order_id} not found in database\")\n       \
      \ raise NotFoundError(\"Order\", order_id)\n\n    logger.info(f\"Retrieved order\
      \ {order_id} for user {_orders[order_id].user_id}\")\n    return _orders[order_id]\n\
      \n\ndef create_order(user_id: int, items: list[dict[str, Any]]) -> Order:\n\
      \    \"\"\"Create new order.\"\"\"\n    logger.debug(f\"create_order called\
      \ with user_id={user_id}, items={items}\")\n\n    # Validate user_id\n    if\
      \ not isinstance(user_id, int) or user_id <= 0:\n        logger.warning(f\"\
      Invalid user_id: {user_id} (type: {type(user_id).__name__})\")\n        raise\
      \ ValidationError(\"user_id\", \"must be a positive integer\")\n\n    # Validate\
      \ items list\n    if not isinstance(items, list) or len(items) == 0:\n     \
      \   logger.warning(f\"Invalid items list: {items}\")\n        raise ValidationError(\"\
      items\", \"must be a non-empty list\")\n\n    # Validate user exists\n    get_user(user_id)\n\
      \n    # Validate products exist and have stock\n    from src.models import OrderItem\n\
      \n    order_items = []\n    for idx, item_data in enumerate(items):\n      \
      \  # Validate item structure\n        if not isinstance(item_data, dict):\n\
      \            logger.warning(f\"Invalid item structure at index {idx}: {item_data}\"\
      )\n            raise ValidationError(f\"items[{idx}]\", \"must be a dictionary\"\
      )\n        if \"product_id\" not in item_data:\n            logger.warning(f\"\
      Missing product_id in item at index {idx}\")\n            raise ValidationError(f\"\
      items[{idx}].product_id\", \"is required\")\n        if \"quantity\" not in\
      \ item_data:\n            logger.warning(f\"Missing quantity in item at index\
      \ {idx}\")\n            raise ValidationError(f\"items[{idx}].quantity\", \"\
      is required\")\n\n        # Validate quantity\n        quantity = item_data[\"\
      quantity\"]\n        if not isinstance(quantity, int) or quantity <= 0:\n  \
      \          logger.warning(f\"Invalid quantity at index {idx}: {quantity}\")\n\
      \            raise ValidationError(f\"items[{idx}].quantity\", \"must be a positive\
      \ integer\")\n\n        product = get_product(item_data[\"product_id\"])\n \
      \       if not product.is_available():\n            logger.error(f\"Product\
      \ {product.id} is out of stock\")\n            raise ValidationError(\"product\"\
      , f\"Product {product.id} is out of stock\")\n\n        # Validate quantity\
      \ doesn't exceed stock\n        if quantity > product.stock:\n            logger.warning(\n\
      \                f\"Quantity {quantity} exceeds stock {product.stock} for product\
      \ {product.id}\"\n            )\n            raise ValidationError(\n      \
      \          f\"items[{idx}].quantity\",\n                f\"requested {quantity}\
      \ but only {product.stock} in stock\"\n            )\n\n        order_items.append(\n\
      \            OrderItem(\n                product_id=product.id,\n          \
      \      quantity=quantity,\n                unit_price=product.price,\n     \
      \       )\n        )\n\n    order_id = len(_orders) + 1\n    order = Order(id=order_id,\
      \ user_id=user_id, items=order_items)\n    _orders[order_id] = order\n\n   \
      \ total = order.total_price()\n    logger.info(\n        f\"Created order {order_id}\
      \ for user {user_id} with {len(order_items)} items \"\n        f\"(total: ${total:.2f})\"\
      \n    )\n    return order\n\n\ndef list_orders(user_id: int | None = None) ->\
      \ list[Order]:\n    \"\"\"List orders, optionally filtered by user.\"\"\"\n\
      \    logger.debug(f\"list_orders called with user_id={user_id}\")\n\n    if\
      \ user_id is not None:\n        if not isinstance(user_id, int) or user_id <=\
      \ 0:\n            logger.warning(f\"Invalid user_id filter: {user_id}\")\n \
      \           raise ValidationError(\"user_id\", \"must be a positive integer\"\
      )\n        # Validate user exists\n        get_user(user_id)\n\n    orders =\
      \ list(_orders.values())\n    if user_id:\n        orders = [o for o in orders\
      \ if o.user_id == user_id]\n        logger.info(f\"Listed {len(orders)} orders\
      \ for user {user_id}\")\n    else:\n        logger.info(f\"Listed all {len(orders)}\
      \ orders\")\n\n    return orders\n"
