  prompt: How does error handling work in api.py?
  response: "## Error Handling in api.py\n\nThe error handling follows a **hierarchical\
    \ exception-based pattern**:\n\n### **Exception Hierarchy**\n\n1. **`APIError`**\
    \ (Base, lines 17-23)\n   - Custom base exception for all API errors\n   - Stores\
    \ `message` and `status_code` (default 400)\n   - Foundation for specific error\
    \ types\n\n2. **`NotFoundError`** (lines 26-30)\n   - Inherits from `APIError`\n\
    \   - Auto-formats: `\"{resource} {id} not found\"`\n   - Status code: 404\n\n\
    3. **`ValidationError`** (lines 33-37)\n   - Inherits from `APIError`\n   - Auto-formats:\
    \ `\"{field}: {message}\"`\n   - Status code: 400\n\n### **Validation Strategy**\n\
    \n**Input Validation** occurs at multiple levels:\n\n1. **Type & Range Checks**\n\
    \   - ID parameters: positive integers (lines 43-44, 87-88, 136-137)\n   - Booleans:\
    \ explicit type checking (line 125)\n   - Lists: non-empty validation (line 150)\n\
    \n2. **Required Fields**\n   - Dictionary keys checked explicitly (lines 55-58,\
    \ 97-102)\n   - Raises `ValidationError` when missing\n\n3. **Format Validation**\n\
    \   - Username/email via dedicated validators (lines 61-66)\n   - String content\
    \ validation (lines 105-106)\n   - Numeric ranges (lines 109-110, 114-115)\n\n\
    4. **Business Logic Validation**\n   - Product stock availability (lines 175-183)\n\
    \   - User existence via `get_user()` call (line 154)\n   - Product existence\
    \ via `get_product()` call (line 174)\n\n### **Patterns Used**\n\n- **Fail-fast**:\
    \ Validation happens before any state modification\n- **Cascading validation**:\
    \ `create_order` validates user/products by calling their getters (lines 154,\
    \ 174)\n- **Contextual messages**: Error messages include field paths for nested\
    \ structures (e.g., `items[{idx}].quantity`)\n- **Separation**: Resource retrieval\
    \ (`get_*`) separated from creation (`create_*`)\n\nNo try/except blocks are present—exceptions\
    \ propagate to caller for centralized handling."
