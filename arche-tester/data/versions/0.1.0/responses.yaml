- duration_ms: 20094
  prompt: Explain how authentication works in this project
  response: "## Authentication in This Project\n\n**Location**: `src/auth.py`\n\n\
    **Type**: Session-based authentication with in-memory storage.\n\n### Flow\n\n\
    ```\nlogin(username, password)\n    ↓\nhash_password() → verify against stored\
    \ hash\n    ↓\ncreate_session(user) → generates URL-safe token (32 bytes)\n  \
    \  ↓\ntoken stored in _sessions dict with expiration\n    ↓\nclient uses token\
    \ for subsequent requests\n```\n\n### Core Components\n\n| Function | Purpose\
    \ |\n|----------|---------|\n| `hash_password()` | SHA-256 with secret key salt\
    \ |\n| `create_session()` | Generates token, stores session with 24h expiry |\n\
    | `get_session()` | Retrieves session, auto-expires if past `expires_at` |\n|\
    \ `require_auth()` | Middleware - raises `PermissionError` if no valid session\
    \ |\n| `require_role()` | Role-based access control (USER, ADMIN, GUEST) |\n\n\
    ### Session Structure\n\n```python\n{\n    \"user_id\": user.id,\n    \"username\"\
    : user.username,\n    \"role\": user.role.value,\n    \"created_at\": datetime,\n\
    \    \"expires_at\": datetime  # +24 hours\n}\n```\n\n### Configuration\n\nFrom\
    \ `config/settings.yaml`:\n- `session_duration_hours`: 24\n- `secret_key_env`:\
    \ reads from `MOCK_SECRET_KEY` environment variable\n\n### Limitations\n\n- **In-memory\
    \ storage**: Sessions lost on restart\n- **No password verification**: `login()`\
    \ skips actual password check (line 96-97 comment: \"In real app, would check\
    \ password hash\")\n- **Hardcoded secret**: `SECRET_KEY = \"mock-secret-key-for-testing\"\
    ` in source"
  test_id: AD-003
