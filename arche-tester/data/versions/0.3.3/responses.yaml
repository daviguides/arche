  prompt: How does error handling work in api.py?
  response: "## Error Handling in api.py\n\n**Custom Exception Hierarchy:**\n\n1.\
    \ **`APIError`** (base, lines 17-23):\n   - Stores `message` and `status_code`\
    \ (default 400)\n   - Base for all API errors\n\n2. **`NotFoundError`** (lines\
    \ 26-30):\n   - Inherits from `APIError`\n   - Status code 404\n   - Format: `\"\
    {resource} {id} not found\"`\n\n3. **`ValidationError`** (lines 33-37):\n   -\
    \ Inherits from `APIError`\n   - Status code 400\n   - Format: `\"{field}: {message}\"\
    `\n\n**Error Patterns:**\n\n**Input Validation** (raises `ValidationError`):\n\
    - Type checking: `isinstance(user_id, int)`\n- Range validation: `user_id <= 0`,\
    \ `price < 0`\n- Required fields: `\"username\" not in data`\n- Format validation:\
    \ `validate_email()`, `validate_username()`\n- Empty checks: `not data[\"name\"\
    ].strip()`\n\n**Resource Validation** (raises `NotFoundError`):\n- Missing IDs:\
    \ `user_id not in _users` (lines 45-46, 89-90, 138-139)\n\n**Business Logic Validation**\
    \ (raises `ValidationError`):\n- Stock availability: `not product.is_available()`\
    \ (line 175-176)\n- Stock quantity: `quantity > product.stock` (lines 179-183)\n\
    - List structure: indexed validation `items[{idx}].quantity` (lines 160-183)\n\
    \n**Validation Reuse:**\n- `get_user()` called within `create_order()` to validate\
    \ user exists (line 154)\n- `get_product()` called within `create_order()` to\
    \ validate products (line 174)\n- Errors propagate automatically through function\
    \ calls"
