- duration_ms: 16333
  prompt: How does auth.py work?
  response: 'The `auth.py` module provides session-based authentication with role-based
    authorization:


    **Core components:**


    - **Password handling**: SHA-256 hashing with salted secret key (lines 22-30)

    - **Session management**: In-memory dictionary storing tokens with 24-hour expiration
    (lines 14-54)

    - **Session tokens**: Generated via `secrets.token_urlsafe(32)` for cryptographic
    randomness (line 35)


    **Key functions:**


    - `create_session(user)` - Issues session token with user metadata and expiration
    timestamp

    - `get_session(token)` - Validates token and auto-expires sessions past their
    lifetime

    - `require_auth(token)` - Guards requiring valid authentication, raises PermissionError
    if invalid

    - `require_role(token, role)` / `require_admin(token)` - Role-based access control
    guards

    - `login(username, password)` - Authenticates user and returns session token (note:
    password validation commented as "would check password hash" on line 96)

    - `logout(token)` - Invalidates session by removing from dictionary

    - `get_current_user(token)` - Retrieves User object from session token


    **Session data structure** contains: `user_id`, `username`, `role`, `created_at`,
    `expires_at`


    **Dependencies**: Uses `User` and `UserRole` from `src.models`, imports `list_users`
    and `get_user` from `src.api` (circular import handled via local imports)'
  test_id: AD-003
  tokens_used: null
