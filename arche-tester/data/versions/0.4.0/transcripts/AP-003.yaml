- content: "## Error Handling Analysis - api.py\n\n### Custom Exception Hierarchy\n\
    \n**Base exception:**\n- `APIError` (lines 17-23): Base class for all API errors\n\
    \  - Properties: `message` (str), `status_code` (int, default 400)\n  - Extends\
    \ Python's `Exception`\n\n**Specialized exceptions:**\n- `NotFoundError` (lines\
    \ 26-30): For missing resources (status 404)\n  - Constructor: `NotFoundError(resource:\
    \ str, id: int)`\n  - Auto-formats message: `\"{resource} {id} not found\"`\n\n\
    - `ValidationError` (lines 33-37): For invalid input (status 400)\n  - Constructor:\
    \ `ValidationError(field: str, message: str)`\n  - Auto-formats message: `\"{field}:\
    \ {message}\"`\n\n### Error Handling Patterns\n\n**1. Input Validation (Type &\
    \ Range)**\n- ID parameters: Must be positive integers\n  - Lines 43-44, 87-88,\
    \ 136-137, 146-147, 202-203\n  - Raises `ValidationError` if invalid\n\n**2. Existence\
    \ Checks**\n- Resources not found: Raises `NotFoundError`\n  - Lines 45-46 (users),\
    \ 89-90 (products), 138-139 (orders)\n\n**3. Required Field Validation**\n- Missing\
    \ fields: Raises `ValidationError(\"{field}\", \"is required\")`\n  - Users: username,\
    \ email (lines 55-58)\n  - Products: name, description, price (lines 97-102)\n\
    \  - Order items: product_id, quantity (lines 164-167)\n\n**4. Format Validation**\n\
    - Username: Delegates to `validate_username()` (lines 61-62)\n- Email: Delegates\
    \ to `validate_email()` (lines 65-66)\n- Product name: Non-empty string (lines\
    \ 105-106)\n- Product price: Non-negative number (lines 109-110)\n- Stock: Non-negative\
    \ integer (lines 114-115)\n\n**5. Business Logic Validation**\n- Product availability:\
    \ Checks `is_available()` (lines 175-176)\n- Stock quantity: Ensures sufficient\
    \ stock (lines 179-183)\n- Order items: Non-empty list (lines 150-151)\n\n**6.\
    \ Nested Validation**\n- Order items (lines 160-191):\n  - Iterates with index\
    \ for precise error messages\n  - Validates structure, types, and business rules\
    \ per item\n  - Error messages include index: `\"items[{idx}].quantity\"`\n\n\
    **7. Cascading Validation**\n- `create_order()` calls `get_user()` and `get_product()`\n\
    - `list_orders()` calls `get_user()` for validation\n- Exceptions propagate up\
    \ from called functions\n\n### Error Message Patterns\n\n**Consistent formatting:**\n\
    - Missing fields: `\"{field}: is required\"`\n- Type errors: `\"{field}: must\
    \ be {type}\"`\n- Range errors: `\"{field}: must be {constraint}\"`\n- Index-specific:\
    \ `\"items[{idx}].{field}: {message}\"`\n\n**No try/except blocks** - Functions\
    \ raise exceptions; caller handles them."
  type: text
test_id: AP-003
