      \n    Returns:\n        Session token string\n\n    Raises:\n        ValueError:\
      \ If username or password is empty/invalid\n        PermissionError: If credentials\
      \ are invalid\n        RuntimeError: If user lookup fails\n    \"\"\"\n    from\
      \ src.api import list_users\n\n    # Validate inputs\n    if not username or\
      \ not isinstance(username, str):\n        raise ValueError(\"Username must be\
      \ a non-empty string\")\n    if not password or not isinstance(password, str):\n\
