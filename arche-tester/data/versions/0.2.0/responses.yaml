- duration_ms: 49483
  prompt: How does auth.py work?
  response: '## Analysis: How auth.py Works


    **Architecture**: Session-based authentication with role-based authorization.


    ### Core Components


    **Session Storage** (line 15):

    - In-memory dictionary storing active sessions

    - Key: session token, Value: user metadata (id, username, role, timestamps)


    **Configuration** (lines 18-19):

    - 24-hour session duration

    - Mock secret key for password hashing


    ### Password Security


    **hash_password()** (lines 22-25):

    - Uses SHA-256 with salt (secret key + password)

    - Returns hexadecimal hash


    **verify_password()** (lines 28-30):

    - Compares hashed password against stored hash


    ### Session Management


    **create_session()** (lines 33-43):

    - Generates secure random token (32 bytes, URL-safe)

    - Stores user metadata with creation and expiration timestamps

    - Returns token for client use


    **get_session()** (lines 46-54):

    - Retrieves session by token

    - Auto-invalidates expired sessions

    - Returns None if not found or expired


    **invalidate_session()** (lines 57-62):

    - Deletes session from storage

    - Returns success boolean


    ### Authorization Middleware


    **require_auth()** (lines 65-72):

    - Validates token exists and is valid

    - Raises PermissionError if authentication fails

    - Returns session data for authorized requests


    **require_role()** (lines 75-80):

    - Checks user has specific role

    - Delegates to require_auth() first

    - Raises PermissionError if role mismatch


    **require_admin()** (lines 83-85):

    - Convenience wrapper for admin role check


    ### Login/Logout Flow


    **login()** (lines 89-98):

    - Fetches users from API (circular import via local import)

    - Matches username (password check commented out)

    - Creates and returns session token

    - Raises PermissionError on invalid credentials


    **logout()** (lines 101-103):

    - Wrapper for invalidate_session()


    **get_current_user()** (lines 106-113):

    - Retrieves User object from session token

    - Uses API to fetch full user data


    ### Key Patterns


    **Security note**: Password verification in login() is commented out (line 96),
    making this mock implementation insecure.


    **Circular import handling**: Uses local imports (lines 91, 111) to avoid circular
    dependencies with src.api.


    **Session expiry**: Automatic cleanup when accessing expired sessions (lines 51-53).'
  test_id: AD-003
  tokens_used: null
