- duration_ms: 18614
  prompt: How does auth.py work?
  response: '## Analysis: auth.py


    **Architecture**: Session-based authentication with in-memory storage


    ### Core Components


    **Session Storage**:

    - In-memory dictionary `_sessions` stores active sessions

    - Sessions expire after 24 hours

    - Each session maps token → user data (user_id, username, role, timestamps)


    **Password Handling**:

    - `hash_password()`: SHA-256 with static salt (SECRET_KEY)

    - `verify_password()`: Compares hash against stored hash

    - Security note: Uses static salt, not per-user salt


    **Session Management**:

    - `create_session()`: Generates cryptographically secure token (32 bytes urlsafe),
    stores user data with expiration

    - `get_session()`: Retrieves session, auto-deletes if expired

    - `invalidate_session()`: Removes session (logout)


    **Authorization Layers**:

    1. `require_auth()`: Validates token exists and session is valid

    2. `require_role()`: Validates token + checks user has specific role

    3. `require_admin()`: Convenience wrapper for admin role check


    **User Flow Functions**:

    - `login()`: Looks up user by username (password check commented out), creates
    session, returns token

    - `logout()`: Invalidates session token

    - `get_current_user()`: Retrieves User object from session token


    ### Dependencies


    Imports from:

    - `src.models`: User, UserRole (data models)

    - `src.api`: list_users(), get_user() (circular imports resolved via local imports)


    ### Security Characteristics


    **Weaknesses** (mock/test context):

    - In-memory sessions (lost on restart)

    - Static SECRET_KEY hardcoded

    - Single salt for all passwords

    - Login function bypasses password verification (line 96 comment)


    **Strengths**:

    - Cryptographically secure token generation

    - Automatic session expiration

    - Role-based access control structure

    - Clear separation of authentication vs authorization'
  test_id: AD-003
