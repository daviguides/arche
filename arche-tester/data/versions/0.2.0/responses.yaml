- duration_ms: 42329
  prompt: How does auth.py work?
  response: '## Analysis: auth.py


    **Purpose**: Authentication and session management module for a mock project.


    ### Core Components


    **Session Storage**:

    - In-memory dictionary `_sessions` stores active sessions keyed by token

    - Each session contains: user_id, username, role, created_at, expires_at


    **Configuration**:

    - `SESSION_DURATION_HOURS`: 24-hour session lifetime

    - `SECRET_KEY`: Mock secret for password hashing (hardcoded for testing)


    ### Functions


    **Password Management**:

    - `hash_password(password)` - SHA-256 hash with secret key salt

    - `verify_password(password, hashed)` - Compare password against hash


    **Session Management**:

    - `create_session(user)` - Generates secure token (32 bytes URL-safe), stores
    session data, returns token

    - `get_session(token)` - Retrieves session, auto-deletes if expired

    - `invalidate_session(token)` - Removes session from storage


    **Authorization**:

    - `require_auth(token)` - Validates session exists and is not expired, raises
    PermissionError if invalid

    - `require_role(token, required_role)` - Checks user has specific role

    - `require_admin(token)` - Shortcut for admin role check


    **User Operations**:

    - `login(username, password)` - Looks up user in `src.api.list_users()`, creates
    session (note: password validation commented out)

    - `logout(token)` - Invalidates session

    - `get_current_user(token)` - Retrieves User object from `src.api.get_user()`
    using session''s user_id


    ### Flow


    1. User calls `login(username, password)` → receives session token

    2. Token passed with subsequent requests

    3. Protected operations call `require_auth(token)` or `require_role(token, role)`

    4. Session validated on each request, auto-expires after 24 hours

    5. User calls `logout(token)` to end session


    ### Dependencies


    Imports `User` and `UserRole` from `src.models`. Circular import handled by importing
    `list_users` and `get_user` from `src.api` inside functions.'
  test_id: AD-003
  tokens_used: null
