- duration_ms: 19006
  prompt: How does error handling work in api.py?
  response: 'Error handling in `api.py` uses a **custom exception hierarchy** with
    three exception classes:


    ## Exception Classes


    **`APIError`** (lines 17-23): Base exception with `message` and `status_code`
    attributes (default 400).


    **`NotFoundError`** (lines 26-30): Inherits from `APIError`, sets status 404,
    formats messages as `"{resource} {id} not found"`.


    **`ValidationError`** (lines 33-37): Inherits from `APIError`, sets status 400,
    formats messages as `"{field}: {message}"`.


    ## Validation Strategy


    All endpoint functions raise exceptions on invalid input rather than returning
    error values:


    **ID validation**: Checks type is `int` and value is positive (lines 43-44, 87-88,
    136-137, 146-147).


    **Existence checks**: Raises `NotFoundError` when IDs not found in storage dicts
    (lines 45-46, 89-90, 138-139).


    **Required fields**: Raises `ValidationError` for missing fields (lines 55-58
    for users, 97-102 for products, 164-167 for order items).


    **Format validation**: Calls helper functions like `validate_username()` and `validate_email()`
    from `src.models` (lines 61-66).


    **Type validation**: Checks types match expectations—bools for flags (line 125),
    non-negative numbers for prices (line 109), positive integers for quantities (line
    171).


    **Business rules**: Validates stock availability (lines 175-176) and sufficient
    inventory (lines 179-183).


    **Nested validation**: Uses array indexing in error messages for list items: `items[{idx}].quantity`
    (line 181).


    **Cascading validation**: Functions call other functions that may raise errors—`create_order()`
    calls `get_user()` and `get_product()` which can raise their own validation/not-found
    errors (lines 154, 174).'
  test_id: AP-003
  tokens_used: null
