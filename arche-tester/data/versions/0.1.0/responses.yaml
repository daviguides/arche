  prompt: How should we add a caching layer to src/api.py?
  response: "**Research complete.** Here are caching approaches for `api.py`:\n\n\
    ---\n\n## Caching Layer Options\n\n### Option A: In-Memory Cache (functools +\
    \ TTL)\n\n**Best for**: Single-instance deployments, simple use cases\n\n```python\n\
    from functools import lru_cache\n# Or with TTL: cachetools.TTLCache\n```\n\n-\
    \ **Pros**: Zero dependencies, fast, simple\n- **Cons**: Not shared across instances,\
    \ lost on restart\n\n**Applies to**: `get_user`, `get_product`, `get_order`, `list_*`\
    \ functions\n\n---\n\n### Option B: Decorator-Based Cache Layer\n\n**Best for**:\
    \ Flexibility, testability\n\n```python\n# New file: src/cache.py\nclass Cache(Protocol):\n\
    \    def get(self, key: str) -> Any | None: ...\n    def set(self, key: str, value:\
    \ Any, ttl: int) -> None: ...\n    def invalidate(self, key: str) -> None: ...\n\
    ```\n\n- **Pros**: Swappable backends (memory → Redis), testable with mocks\n\
    - **Cons**: More code, abstraction overhead\n\n---\n\n### Option C: Redis/External\
    \ Cache\n\n**Best for**: Multi-instance, persistent cache\n\n```python\nimport\
    \ redis\ncache = redis.Redis()\n```\n\n- **Pros**: Shared across instances, survives\
    \ restarts, scalable\n- **Cons**: External dependency, network latency, serialization\
    \ needed\n\n---\n\n## Recommended Approach\n\n**Start with Option B** (decorator-based\
    \ abstraction) with **Option A** as default backend:\n\n1. Create `src/cache.py`\
    \ with `Cache` protocol + `MemoryCache` implementation\n2. Add `@cached(\"user:{user_id}\"\
    )` decorator pattern\n3. Invalidate cache on `create_*` mutations\n4. Later: swap\
    \ to Redis without changing API code\n\n**Cache targets**:\n- `get_user(user_id)`\
    \ - high read frequency\n- `get_product(product_id)` - high read frequency\n-\
    \ `list_products()` - invalidate on product changes\n- `list_users()` - invalidate\
    \ on user changes\n\n---\n\nWhich approach fits your needs? Or should I elaborate\
    \ on any option?"
  test_id: AP-004
  tokens_used: null
