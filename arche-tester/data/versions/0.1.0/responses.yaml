    - `INFO`: Successful operations (user created, order placed)

    - `WARNING`: Validation failures before exceptions

    - `ERROR`: Unexpected errors

    - `DEBUG`: Entry/exit with parameters


    **Option B - Minimal Error-Focused Logging**:

    1. Add logger at module level

    2. Log only when exceptions are raised

    3. Focus on error tracking and debugging


    **Option C - Comprehensive with Performance Metrics**:

    1. Include Option A

    2. Add execution time tracking for operations

    3. Log resource counts and filter operations


    **Trade-offs**:

    - **Option A**: Balanced - good visibility without noise

    - **Option B**: Minimal - only errors, less context for debugging

    - **Option C**: Verbose - rich data but more log volume


