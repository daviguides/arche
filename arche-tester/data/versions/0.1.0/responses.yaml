- duration_ms: 43039
  prompt: How does error handling work in api.py?
  response: "## Error Handling in api.py\n\nError handling in `api.py` uses a **hierarchical\
    \ custom exception system** with validation at multiple layers.\n\n### Exception\
    \ Hierarchy\n\n**Base exception:**\n- `APIError` (lines 17-23) - Base class with\
    \ `message` and `status_code` attributes\n\n**Specialized exceptions:**\n- `NotFoundError`\
    \ (lines 26-30) - For missing resources (404)\n- `ValidationError` (lines 33-37)\
    \ - For invalid inputs (400)\n\n### Error Handling Patterns\n\n**Type validation:**\n\
    ```python\nif not isinstance(user_id, int) or user_id <= 0:\n    raise ValidationError(\"\
    user_id\", \"must be a positive integer\")\n```\n\n**Existence checks:**\n```python\n\
    if user_id not in _users:\n    raise NotFoundError(\"User\", user_id)\n```\n\n\
    **Required field validation:**\n```python\nif \"username\" not in data:\n    raise\
    \ ValidationError(\"username\", \"is required\")\n```\n\n**Format validation:**\n\
    ```python\nif not validate_username(data[\"username\"]):\n    raise ValidationError(\"\
    username\", \"must be at least 3 alphanumeric characters\")\n```\n\n**Business\
    \ logic validation:**\n```python\nif not product.is_available():\n    raise ValidationError(\"\
    product\", f\"Product {product.id} is out of stock\")\n```\n\n**Nested validation**\
    \ (order items - lines 160-183) - validates array elements with indexed error\
    \ messages like `items[{idx}].quantity`\n\n### Key Characteristics\n\n- **Fail-fast**:\
    \ Validates inputs immediately before processing\n- **Descriptive errors**: Field\
    \ name + specific message format\n- **Cascading validation**: `create_order` calls\
    \ `get_user` and `get_product`, which raise their own validation errors\n- **Type\
    \ safety**: Checks `isinstance()` before value range validation"
  test_id: AP-003
  tokens_used: null
