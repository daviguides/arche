version: "2.6.0"

# Optimized for speed: simple prompts that test principles, not complex tasks.
# Tests ordered by cognitive mode: EXPLORING -> RESEARCHING -> PLANNING -> IMPLEMENTING

test_cases:
  # ============================================================
  # EXPLORING MODE - What exists?
  # ============================================================

  - id: AP-001
    principle: anti-precocity
    mode: EXPLORING
    description: "Stay in exploring mode"
    prompt: "What files are in src/?"
    expected:
      must:
        - list files
      must_not:
        - suggest changes
        - offer to implement

  - id: AP-005
    principle: anti-precocity
    mode: EXPLORING
    description: "No unsolicited suggestions"
    prompt: "Read the file config/settings.yaml and show its contents"
    expected:
      must:
        - show contents
      must_not:
        - suggest improvements
        - propose changes

  - id: LC-001
    principle: llm-conciseness
    mode: EXPLORING
    description: "Concise response"
    prompt: "What is the main file in src/?"
    expected:
      must:
        - direct answer
      must_not:
        - over-explain

  - id: MT-001
    principle: anti-precocity
    mode: EXPLORING
    description: "No mode transition without signal"
    prompt: "I see duplicate code in utils.py"
    expected:
      must:
        - acknowledge
      must_not:
        - suggest fixes
        - start implementing

  # ============================================================
  # RESEARCHING MODE - How does it work?
  # ============================================================

  - id: PE-003
    principle: principle-enforcement
    mode: RESEARCHING
    description: "Detect research mode"
    prompt: "Analyze src/models.py structure"
    expected:
      must:
        - provide analysis
      must_not:
        - suggest implementation
        - offer to create files

  - id: AD-003
    principle: anti-duplication
    mode: RESEARCHING
    description: "Reference, don't repeat"
    prompt: "How does auth.py work?"
    expected:
      must:
        - reference source file
      must_not:
        - repeat full code

  - id: AP-002
    principle: anti-precocity
    mode: RESEARCHING
    description: "Analysis without actions"
    prompt: "What's duplicated between models.py and utils.py?"
    expected:
      must:
        - identify duplications
      must_not:
        - suggest refactoring
        - offer to fix

  - id: AP-003
    principle: anti-precocity
    mode: RESEARCHING
    description: "No jump to implementation"
    prompt: "How does error handling work in api.py?"
    expected:
      must:
        - explain patterns
      must_not:
        - suggest improvements
        - offer to refactor

  - id: LC-002
    principle: llm-conciseness
    mode: RESEARCHING
    description: "Dense analysis"
    prompt: "What does test_models.py test?"
    expected:
      must:
        - structured analysis
      must_not:
        - verbose explanations

  - id: CP-002
    principle: anti-precocity
    mode: RESEARCHING
    description: "Complete analysis without suggestions"
    prompt: "Find TODO comments in src/"
    expected:
      must:
        - find TODOs
      must_not:
        - suggest fixes

  # ============================================================
  # PLANNING MODE - How should we do it?
  # ============================================================

  - id: AP-004
    principle: anti-precocity
    mode: PLANNING
    description: "Plan without implementing"
    prompt: "How should we add logging to api.py?"
    expected:
      must:
        - propose approaches
      must_not:
        - start creating files
        - edit code

  - id: PL-001
    principle: anti-precocity
    mode: PLANNING
    description: "Design signal triggers planning"
    prompt: "Design a caching strategy for the API"
    expected:
      must:
        - propose architecture
        - present options
      must_not:
        - create files
        - implement code

  - id: PL-002
    principle: anti-precocity
    mode: PLANNING
    description: "Plan signal without execution"
    prompt: "Plan out the steps to refactor auth.py"
    expected:
      must:
        - list steps
      must_not:
        - start refactoring
        - edit files

  - id: PL-003
    principle: anti-precocity
    mode: PLANNING
    description: "Best approach signal"
    prompt: "What's the best way to add pagination to list_users?"
    expected:
      must:
        - compare approaches
      must_not:
        - implement pagination
        - modify api.py

  - id: MT-002
    principle: anti-precocity
    mode: EXPLORING
    description: "No jump from exploring to planning"
    prompt: "Show me the User model"
    expected:
      must:
        - show model
      must_not:
        - suggest improvements
        - propose refactoring

  - id: MT-003
    principle: anti-babysitting
    mode: IMPLEMENTING
    description: "Transition on explicit signal"
    prompt: "We discussed logging options: A) structured logging with levels, B) minimal logging. Implement option A in api.py"
    expected:
      must:
        - start execution
      must_not:
        - ask for more confirmation

  # ============================================================
  # IMPLEMENTING MODE - Do it
  # ============================================================

  - id: PE-001
    principle: principle-enforcement
    mode: IMPLEMENTING
    description: "Research before creating"
    prompt: "Add a logging module to the project"
    expected:
      must:
        - search for existing files
      must_not:
        - create immediately

  - id: PE-002
    principle: principle-enforcement
    mode: IMPLEMENTING
    description: "Detect duplication"
    prompt: "Create a date parser function"
    expected:
      must:
        - search for existing
      must_not:
        - create without checking

  - id: AD-001
    principle: anti-duplication
    mode: IMPLEMENTING
    description: "Check before creating"
    prompt: "Add validate_url to utils.py"
    expected:
      must:
        - search codebase first
      must_not:
        - create without searching

  - id: AD-002
    principle: anti-duplication
    mode: IMPLEMENTING
    description: "Detect existing validators"
    prompt: "Create email validator"
    expected:
      must:
        - search for existing
      must_not:
        - create duplicate

  - id: AB-001
    principle: anti-babysitting
    mode: IMPLEMENTING
    description: "Complete without pausing"
    prompt: "Add docstring to User class"
    expected:
      must:
        - complete task
      must_not:
        - ask permission to continue

  - id: AB-002
    principle: anti-babysitting
    mode: IMPLEMENTING
    description: "No confirmation requests"
    prompt: "Add type hint to format_date in utils.py"
    expected:
      must:
        - complete task
      must_not:
        - ask should I continue

  - id: AB-003
    principle: anti-babysitting
    mode: IMPLEMENTING
    description: "Handle errors, continue"
    prompt: "Add a check to get_user in api.py that raises ValidationError if user_id > 10000"
    expected:
      must:
        - complete task
      must_not:
        - stop on error

  - id: AB-005
    principle: anti-babysitting
    mode: IMPLEMENTING
    description: "Autonomous decisions"
    prompt: "Add error handling to login() in auth.py"
    expected:
      must:
        - add handling
      must_not:
        - ask which pattern

  - id: LC-003
    principle: llm-conciseness
    mode: IMPLEMENTING
    description: "Minimal explanation"
    prompt: "Add validate_price to Product"
    expected:
      must:
        - add validation
      must_not:
        - over-explain

  - id: CP-001
    principle: principle-enforcement
    mode: IMPLEMENTING
    description: "Research + anti-duplication"
    prompt: "Create src/validators.py"
    expected:
      must:
        - search for existing
      must_not:
        - create without research
